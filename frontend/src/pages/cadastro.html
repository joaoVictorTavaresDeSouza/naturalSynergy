<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../public/nSynergyIco.ico" type="image/x-icon">
    <title>Cadastro | Natural Synergy</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

    <div id="loader">
        <div class="indicadorCarregamento"></div>
    </div>

    <main class="paginaLogin">

        <section class="arteLogin">
            <div class="camadaArte camada1"></div>
            <div class="camadaArte camada2"></div>
            <div class="camadaArte camada3"></div>
            <div class="camadaArte camada4"></div>

            <div class="logoArte">
                <img src="../../src/assets/transparentLogoNaturalSynergy.png" alt="Natural Synergy">
            </div>
        </section>

        <section class="painelLogin">
            <div class="caixaLogin">

                <a href="../../index.html" class="marca">
                    <img src="../../src/assets/logoNaturalSynergy.png" alt="Logo">
                    <span>Natural Synergy</span>
                </a>

                <div class="cabecalhoLogin">
                    <h1 class="tituloLogin">Crie sua conta</h1>
                    <p class="subtituloLogin">Preencha os dados para se cadastrar.</p>
                </div>

                <form class="formularioLogin">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password" required>
                    </div>

                    <div class="campo">
                        <label for="confirmar-senha">Confirmar senha</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha" autocomplete="new-password" required>
                    </div>

                    <button type="submit" class="botaoLogin">Cadastrar</button>
                </form>

                <div class="divisorLogin"></div>

                <a href="./login.html" class="cartaoAlternancia">
                    <div class="textoAlternancia">
                        <span class="rotuloAlternancia">Já tem conta?</span>
                        <strong class="acaoAlternancia">Entrar</strong>
                    </div>
                    <span class="setaAlternancia">›</span>
                </a>

            </div>
        </section>

    </main>

    <script src="../js/main.js"></script>

</body>
</html>
